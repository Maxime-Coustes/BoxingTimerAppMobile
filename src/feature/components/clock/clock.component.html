<div class="time-display-container" [class.rest-phase]="currentPhase === 'Rest'" [class.active-phase]="currentPhase === 'Active'">
  <div class="round-pill" *ngIf="displayRound">
    <span>Round</span>
    <strong>{{ currentRound }} / {{ rounds }}</strong>
  </div>

  <div class="time-display">
    <p class="phase-label">{{ currentPhase || 'Ready' }}</p>
    <div class="time-value">{{ formatTime(timeLeft) }}</div>
  </div>
</div>
